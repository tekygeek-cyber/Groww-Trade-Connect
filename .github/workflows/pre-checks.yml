name: PRE security and build checks
on:
  pull_request:
  push:
    branches: [main, pre/**]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install lockfile dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Pure authentication tests
        run: bun run test
      - name: Mocked Groww exchange tests
        run: bun run test:auth-integration
      - name: Rebalance rule and cash invariant tests
        run: bun run test:rebalance
      - name: Currency and quote provenance tests
        run: bun run test:market-integrity
      - name: Local LLM harness and failure-path tests
        run: bun run test:ai-harness
      - name: Master prompt completeness and safety contract
        run: node --test tests/prompt-contract.test.mjs
      - name: Deterministic trading risk and rehearsal tests
        run: bun run test:risk-gate
      - name: Offline broker contract test (no external orders)
        run: bun run test:mock-broker
      - name: Kraken Spot read-only credential diagnostic tests
        run: bun run test:kraken-readonly
      - name: Install headless browser smoke harness
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps playwright
          npx playwright install --with-deps chromium
      - name: Browser and API smoke — desktop/mobile
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 bun run dev > /tmp/gtc-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; cat /tmp/gtc-server.log' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then echo "Server did not become ready"; exit 1; fi
          TEST_BASE_URL=http://127.0.0.1:3000 node --test tests/http-smoke.test.mjs
          TEST_BASE_URL=http://127.0.0.1:3000 node tests/browser-smoke.mjs
      - name: Compiled production HTTP/static-assets smoke
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=3010 node dist/server.js > /tmp/gtc-production.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; cat /tmp/gtc-production.log' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3010/api/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then echo "Compiled server unavailable"; exit 1; fi
          curl -fsS http://127.0.0.1:3010/ | grep -q '<title>Groww Connect</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3010/api/profile)" = "401"
          echo "PASS: compiled Node entrypoint serves app shell and denies anonymous profile"

name: PRE security and build checks
on:
  pull_request:
  push:
    branches: [main, pre/**]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install lockfile dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Pure authentication tests
        run: bun run test
      - name: Mocked Groww exchange tests
        run: bun run test:auth-integration

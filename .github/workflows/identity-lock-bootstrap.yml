name: One-time Identity SDK lockfile bootstrap (no deployment)

on:
  push:
    branches:
      - feature/owner-only-auth-foundation-20261103
    paths:
      - .github/workflows/identity-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  lockfiles:
    # Only the explicitly marked bootstrap commit may write, never arbitrary pushes.
    if: contains(github.event.head_commit.message, '[identity-lock-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Synchronize Bun lockfile for declared dependencies
        run: bun install
      - name: Synchronize npm lockfile for declared dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Commit only dependency lockfiles to the SAME feature branch
        run: |
          set -euo pipefail
          git add -- bun.lock package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already synchronized"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore(identity): synchronize dependency lockfiles"
            git push origin "HEAD:refs/heads/feature/owner-only-auth-foundation-20261103"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-dependency-lockfiles
          path: |
            bun.lock
            package-lock.json
          retention-days: 2

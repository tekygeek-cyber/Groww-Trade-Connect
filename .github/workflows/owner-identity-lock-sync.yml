name: Sync Identity SDK lockfiles on lab branch (no deployment)

on:
  push:
    branches: [feature/owner-only-auth-foundation-20261103]
    paths:
      - .github/workflows/owner-identity-lock-sync.yml

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update npm lockfile without running package lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Update Bun lockfile
        run: bun install --lockfile-only --ignore-scripts
      - name: Verify both lockfiles exist
        run: |
          test -s package-lock.json
          test -s bun.lock
          git diff --stat -- package-lock.json bun.lock
      - name: Commit lockfile-only changes to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json bun.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already synchronized"
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build(identity): sync locked SDK dependencies [locksync]'
            git push origin HEAD:feature/owner-only-auth-foundation-20261103
          fi
